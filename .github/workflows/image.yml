# The migrator on its own, as an image. It carries no schema: the files come off
# a mount, so one tag runs every database.
name: Image

on:
  push:
    branches: [master]
    paths:
      - src/**
      - Cargo.toml
      - Dockerfile
      - .github/workflows/image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version stamp
        id: tag
        run: echo "value=$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push
        run: |
          set -eu
          image=globalartltd/sqlmig
          docker build -t "$image:${{ steps.tag.outputs.value }}" -t "$image:latest" .
          docker push "$image:${{ steps.tag.outputs.value }}"
          docker push "$image:latest"
          echo "  published: $image:${{ steps.tag.outputs.value }}"
