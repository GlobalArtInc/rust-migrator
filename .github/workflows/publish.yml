# Publishes to crates.io. The version comes from Cargo.toml; the tag is only the
# occasion.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: "Build and check the package without publishing it."

jobs:
  publish:
    uses: GlobalArtInc/ci-cd/.github/workflows/cargo-publish.yml@master
    with:
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
