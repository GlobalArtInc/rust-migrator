# Publishes to crates.io. The version comes from Cargo.toml; the tag is only the
# occasion.
#
# The steps are the ones in GlobalArtInc/ci-cd/.github/workflows/cargo-publish.yml,
# written out here rather than called: ci-cd is private, this repository is
# public, and github will not let a public repository call a reusable workflow
# out of a private one. The reusable copy stays where it is for the crates that
# are not published.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: "Build and check the package without publishing it."

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read the name and the version
        id: crate
        run: |
          set -eu
          metadata=$(cargo metadata --no-deps --format-version 1)
          name=$(echo "$metadata" | jq -r '.packages[0].name')
          version=$(echo "$metadata" | jq -r '.packages[0].version')
          [ -n "$name" ] && [ "$name" != "null" ] || { echo "no such package"; exit 1; }

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing $name $version"

      # A re-run against a version that is already out is not a broken build but
      # an event that means nothing: a tag was moved, a workflow was restarted.
      # There is nothing to publish and no reason to go red.
      - name: Look for the version in the registry
        id: registry
        run: |
          set -eu
          name='${{ steps.crate.outputs.name }}'
          version='${{ steps.crate.outputs.version }}'
          body=$(curl -sS --max-time 30 -H "User-Agent: GlobalArtInc-ci" \
            "https://crates.io/api/v1/crates/$name/$version" || echo '{}')

          if echo "$body" | jq -e '.version.num?' >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name $version is already in the registry"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the package
        if: steps.registry.outputs.published == 'false'
        run: cargo package

      - name: Publish
        if: steps.registry.outputs.published == 'false' && inputs.dry_run != true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify

      - name: Say what happened
        run: |
          if [ '${{ steps.registry.outputs.published }}' = 'true' ]; then
            echo "already published: ${{ steps.crate.outputs.name }} ${{ steps.crate.outputs.version }}"
          elif [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo "checked, not published: ${{ steps.crate.outputs.name }} ${{ steps.crate.outputs.version }}"
          else
            echo "published: ${{ steps.crate.outputs.name }} ${{ steps.crate.outputs.version }}"
          fi
