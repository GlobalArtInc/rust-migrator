[package]
name = "sqlmig"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
description = "SQL migrations for Rust services, on the table TypeORM left behind"
license = "ISC"
repository = "https://github.com/GlobalArtInc/rust-migrator"
readme = "README.md"
keywords = ["migrations", "postgres", "sea-orm", "typeorm"]
documentation = "https://docs.rs/sqlmig"
categories = ["database"]

[[bin]]
name = "sqlmig"
required-features = ["bin"]

[features]
bin = ["dep:tokio", "dep:tracing-subscriber"]

[dependencies]
include_dir = "0.7.4"
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"], optional = true }

[dev-dependencies]
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
